    <!-- Разработай две  связанные веб-страницы для отработки заданий ОГЭ по информатике и предоставь их полный исходный код. Каждая страница — автономный HTML-файл со встроенными CSS и JavaScript, без внешних зависимостей и сборки, пригодный для GitHub Pages.

Структура. Две страницы: index.html — задание №7 «Адресация в сети Интернет», task1.html — задание №1 «Количество информации. Поиск информации». В шапке каждой страницы рядом с переключателем темы должна быть кнопка перехода на соседнюю страницу: на задании №7 — кнопка 📘, ведущая на task1.html; на задании №1 — кнопка 📁, ведущая на index.html. Кнопки оформлены так же, как переключатель темы.

Задание №7. Генерируется условие про доступ к файлу или про IP-адрес. Дан список фрагментов адреса, закодированных цифрами от 1 до N. Ученик вводит последовательность цифр, кодирующую адрес. Реализуй 4 прототипа по мотивам ФИПИ:

URL-адрес с мелким дроблением: протокол, ://, сервер, .tld, /, имя файла, расширение — 7 фрагментов (аналог №18037).

IP-адрес: 4 числа, одно с ведущей точкой (аналог №538, №498).

URL с протоколом — 7 фрагментов (аналог №1028).

URL с каталогом — 8 фрагментов с двумя слэшами (аналог №37529).

Задания на электронную почту и прототипы с лишними фрагментами не включать. Количество фрагментов — от 4 до 8, дробление атомарное (://, /, .tld, расширение — отдельные фрагменты). Названия файлов, серверов, доменов, протоколов и расширений каждый раз меняются, но берутся из заданных списков. Номера фрагментов перемешиваются, чтобы ответ никогда не был 12345….

Интерфейс: сверху условие, слева — пронумерованные фрагменты, по клику переносятся в центр. В центре собранный адрес отображается как единая цельная строка URL без номеров; чипы без фона, рамок и зазоров, при наведении подсвечиваются, при клике возвращают фрагмент обратно. Снизу — поле ответа (цифры без пробелов) и кнопки «Проверить», «Решение», «Новое задание».

Проверка: пустой ответ — «Введите ответ»; не цифры — «Ответ должен состоять только из цифр»; несовпадение длины — сообщение с указанием количества цифр и правильной последовательности; неверный порядок — сообщение с правильной последовательностью; верный — подтверждение.

Раздел «Решение»: правило формирования адреса в стиле ФИПИ, эталонный адрес, правильная последовательность цифр, пояснение по каждому фрагменту.

Задание №1. Генерируется условие одного из 4 типов. Ответ — число или слово, поэтому поле ввода без inputmode="numeric".

Поиск по запросу: таблица с количеством страниц по A, B, A & B; найти A | B по формуле включений-исключений.

Три множества: таблица с тремя словами и попарными пересечениями; найти A | B | C.

Логическая задача: 4 города, 4 реки, условия; определить реку для заданного города.

Перебор слов: сколько слов заданной длины можно составить из набора букв в алфавитном порядке.

Списки слов вынести в объект WORDS по категориям: города, реки, имена, мебель, животные, профессии, страны, цвета, спорт, школьные предметы. Каждый прототип случайно выбирает категорию.

Оформление — как на странице задания №7: сверху условие (таблицы разметкой <table>), под ним вопрос, ниже поле ввода и кнопки «Проверить», «Решение», «Новое задание». Проверка без учёта регистра: пустой — «Введите ответ»; неверный — с указанием правильного ответа; верный — подтверждение. «Решение» содержит объяснение и правильный ответ.

Оформление обеих страниц. Тёмная тема с переключателем в шапке, сохранение в localStorage с разными ключами (oge7-theme и oge1-theme), по умолчанию — системная тема. Аккуратный современный вид без лишней декоративности, max-width: 1400px. Без placeholder и без подсказок вида «💡 клик по чипу в центре — вернуть часть обратно». Тексты — в нейтральном официальном стиле.

-->

<script>
    (function () {
        /* ============================================================

        const WORDS = {
            cities:  ['Москва', 'Санкт-Петербург', 'Новосибирск', 'Екатеринбург', 'Казань',

                      'Дон', 'Кубань', 'Урал', 'Ока', 'Кама',

            colors: ['красный', 'оранжевый', 'жёлтый', 'зелёный', 'голубой',
                     'синий', 'фиолетовый', 'белый', 'чёрный', 'серый',
                     'коричневый', 'розовый', 'бирюзовый', 'бежевый', 'золотой'],
            sports: ['футбол', 'хоккей', 'теннис', 'баскетбол', 'волейбол',

            subjects: ['математика', 'русский язык', 'физика', 'химия', 'биология',

                       'немецкий язык', 'французский язык', 'обществознание', 'ОБЖ', 'технология']
        };

        const rand = arr => arr[Math.floor(Math.random() * arr.length)];
        const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function pickNUnique(arr, n) {
            const copy = shuffle(arr);
            return copy.slice(0, n);
        }

        /* ============================================================
         *  ПРОТОТИПЫ ЗАДАНИЯ №1
         *  ============================================================ */

        /* Прототип 1.
         * Поиск страниц, где встречаются оба слова.
         * Формат: дана таблица запросов и количество найденных страниц.
         * Нужно найти количество страниц по новому запросу.
         */
        function proto1() {
            const cat = rand(['cities', 'rivers', 'animals', 'furniture']);
            const words = pickNUnique(WORDS[cat], 3);
            const [A, B, C] = words;

            // N(A) = X, N(B) = Y, N(A & B) = Z, найти N(A | B)
            const both = randInt(20, 80);
            const onlyA = randInt(30, 100);
            const onlyB = randInt(30, 100);
            const nA = both + onlyA;
            const nB = both + onlyB;
            const nAorB = both + onlyA + onlyB;

            const table = `
                <table>
                    <tr><th>Запрос</th><th>Найдено страниц (в тысячах)</th></tr>
                    <tr><td>${A}</td><td>${nA}</td></tr>
                    <tr><td>${B}</td><td>${nB}</td></tr>
                    <tr><td>${A} &amp; ${B}</td><td>${both}</td></tr>
                </table>
            `;

            const desc = `В языке запросов поискового сервера для обозначения логической операции «ИЛИ» ` +
                         `используется символ «|», а для логической операции «И» — символ «&amp;».` +
                         table;
            const question = `Какое количество страниц (в тысячах) будет найдено по запросу ` +
                             `<b>${A} | ${B}</b>?`;
            const answer = String(nAorB);
            const explain = `По формуле включений-исключений: N(A | B) = N(A) + N(B) − N(A & B) = ` +
                            `${nA} + ${nB} − ${both} = <b>${nAorB}</b> (тысяч страниц).`;

            return { desc, question, answer, explain, prototypeName: 'Поиск по запросу' };
        }

        /* Прототип 2.
         * Даны два слова и таблица с количеством страниц.
         * Найти, сколько страниц найдено по запросу «A & B & C».
         */
        function proto2() {
            const cat = rand(['cities', 'rivers', 'colors', 'sports']);
            const words = pickNUnique(WORDS[cat], 3);
            const [A, B, C] = words;

            const nA = randInt(120, 300);
            const nB = randInt(120, 300);
            const nC = randInt(120, 300);
            const nAB = randInt(20, 60);
            const nAC = randInt(20, 60);
            const nBC = randInt(20, 60);
            const nABC = randInt(5, 15);

            const table = `
                <table>
                    <tr><th>Запрос</th><th>Найдено страниц (в тысячах)</th></tr>
                    <tr><td>${A}</td><td>${nA}</td></tr>
                    <tr><td>${B}</td><td>${nB}</td></tr>
                    <tr><td>${C}</td><td>${nC}</td></tr>
                    <tr><td>${A} &amp; ${B}</td><td>${nAB}</td></tr>
                    <tr><td>${A} &amp; ${C}</td><td>${nAC}</td></tr>
                    <tr><td>${B} &amp; ${C}</td><td>${nBC}</td></tr>
                    <tr><td>${A} &amp; ${B} &amp; ${C}</td><td>${nABC}</td></tr>
                </table>
            `;

            const desc = `В языке запросов поискового сервера для обозначения логической операции «ИЛИ» ` +
                         `используется символ «|», а для логической операции «И» — символ «&amp;».` +
                         table;
            const question = `Какое количество страниц (в тысячах) будет найдено по запросу ` +
                             `<b>${A} | ${B} | ${C}</b>?`;
            // По формуле включений-исключений для трёх множеств:
            const nAorBorC = nA + nB + nC - nAB - nAC - nBC + nABC;
            const answer = String(nAorBorC);
            const explain = `По формуле включений-исключений для трёх множеств: ` +
                            `N(A | B | C) = N(A) + N(B) + N(C) − N(A & B) − N(A & C) − N(B & C) + N(A & B & C) = ` +
                            `${nA} + ${nB} + ${nC} − ${nAB} − ${nAC} − ${nBC} + ${nABC} = <b>${nAorBorC}</b> (тысяч страниц).`;

            return { desc, question, answer, explain, prototypeName: 'Три множества' };
        }

        /* Прототип 3.
         * Логическая задача: «В каком городе и какая река протекает?»
         * Даны варианты городов и рек, даны условия. Нужно найти ответ.
         */
        function proto3() {
            const cities = pickNUnique(WORDS.cities, 4);
            const rivers = pickNUnique(WORDS.rivers, 4);
            // Правильная пара: city[0] — river[0]
            const [cityA, cityB, cityC, cityD] = cities;
            const [riverA, riverB, riverC, riverD] = rivers;

            const desc = `Учитель написал на доске четыре города: <b>${cityA}</b>, <b>${cityB}</b>, ` +
                         `<b>${cityC}</b>, <b>${cityD}</b> — и четыре реки: <b>${riverA}</b>, ` +
                         `<b>${riverB}</b>, <b>${riverC}</b>, <b>${riverD}</b>. ` +
                         `Известно, что в каждом городе протекает ровно одна река, и каждая река ` +
                         `протекает ровно в одном городе. Также известно, что река <b>${riverB}</b> ` +
                         `протекает в городе <b>${cityB}</b>, а река <b>${riverA}</b> — не в городе ` +
                         `<b>${cityB}</b>. В городе <b>${cityD}</b> протекает река <b>${riverD}</b>.`;
            const question = `Какая река протекает в городе <b>${cityA}</b>? В ответе укажите название реки.`;
            const answer = riverA;
            const explain = `Из условия: река ${riverB} — в городе ${cityB}; река ${riverD} — в городе ` +
                            `${cityD}; река ${riverA} — не в городе ${cityB}. Значит, для города ${cityA} ` +
                            `подходит река ${riverA}, а остальные распределяются между ${cityC} и ${cityB}. ` +
                            `Ответ: <b>${riverA}</b>.`;

            return { desc, question, answer, explain, prototypeName: 'Логическая задача' };
        }

        /* Прототип 4.
         * Количество слов заданной длины из заданного алфавита.
         * Например: все 4-буквенные слова из букв А, Б, В, Г, идущие в алфавитном порядке.
         */
        function proto4() {
            const subjects = pickNUnique(WORDS.subjects, 1);
            const letterPools = [
                ['А', 'Б', 'В', 'Г'],
                ['А', 'Б', 'В'],
                ['А', 'Б', 'В', 'Г', 'Д'],
                ['К', 'Л', 'М', 'Н'],
                ['П', 'Р', 'С', 'Т']
            ];
            const pool = rand(letterPools);
            const n = randInt(3, 4);
            const sorted = [...pool].sort();
            const first = sorted[0];
            const last = sorted[sorted.length - 1];

            // Число слов длины n в алфавитном порядке из |pool| букв = C(|pool| + n - 1, n)
            function comb(a, b) {
                if (b < 0 || b > a) return 0;
                let num = 1, den = 1;
                for (let i = 1; i <= b; i++) {
                    num *= a - i + 1;
                    den *= i;
                }
                return num / den;
            }
            const total = comb(pool.length + n - 1, n);

            const desc = `Сколько существует различных слов длины <b>${n}</b>, которые можно составить ` +
                         `из букв <b>${pool.join(', ')}</b>, если буквы в слове должны идти в алфавитном ` +
                         `порядке (например, <b>${first}${first}${first}</b> или <b>${first}${sorted[1]}${last}</b>)? ` +
                         `Слова длины ${n}, все буквы различны или могут повторяться, но не убывают.`;
            const question = `В ответе укажите число.`;
            const answer = String(total);
            const explain = `Число неубывающих последовательностей длины ${n} из ${pool.length} букв ` +
                            `равно числу сочетаний с повторениями: C(${pool.length} + ${n} − 1, ${n}) = ` +
                            `C(${pool.length + n - 1}, ${n}) = <b>${total}</b>.`;

            return { desc, question, answer, explain, prototypeName: 'Перебор слов' };
        }

        const PROTOTYPES = [proto1, proto2, proto3, proto4];

        /* ---------- Состояние ---------- */
        let currentTask = null;

        /* ---------- DOM ---------- */
        const taskDescEl = document.getElementById('taskDesc');
        const taskQuestionEl = document.getElementById('taskQuestion');
        const answerInput = document.getElementById('answerInput');
        const feedback = document.getElementById('feedback');
        const prototypeBadge = document.getElementById('prototypeBadge');
        const themeToggle = document.getElementById('themeToggle');

        /* ---------- Тема ---------- */
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            try { localStorage.setItem('oge1-theme', theme); } catch (e) {}
        }

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('oge1-theme'); } catch (e) {}
            if (saved === 'dark' || saved === 'light') {
                applyTheme(saved);
            } else {
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        /* ---------- Отрисовка ---------- */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setFeedback(type, html) {
            feedback.className = 'feedback ' + type;
            feedback.innerHTML = html;
        }

        function checkAnswer() {
            const raw = answerInput.value.trim();
            if (!raw) {
                setFeedback('incorrect', 'Введите ответ.');
                return;
            }
            const expected = String(currentTask.answer).trim();
            const ok = raw.toLowerCase() === expected.toLowerCase();
            if (ok) {
                setFeedback('correct', 'Верно. Ответ: <b>' + escapeHtml(expected) + '</b>.');
            } else {
                setFeedback('incorrect',
                    'Неверно. Вы указали <b>' + escapeHtml(raw) + '</b>. ' +
                    'Правильный ответ: <b>' + escapeHtml(expected) + '</b>. ' +
                    'Разбор смотрите в разделе «Решение».');
            }
        }

        function showSolution() {
            setFeedback('solution',
                '<div class="sol-title">Решение</div>' +
                '<div class="sol-explain">' + currentTask.explain + '</div>' +
                '<div class="sol-label">Правильный ответ:</div>' +
                '<div class="sol-answer">' + escapeHtml(currentTask.answer) + '</div>'
            );
        }

        function newTask() {
            const factory = rand(PROTOTYPES);
            currentTask = factory();
            answerInput.value = '';
            prototypeBadge.textContent = 'Прототип: ' + currentTask.prototypeName;
            taskDescEl.innerHTML = currentTask.desc;
            taskQuestionEl.innerHTML = currentTask.question;
            setFeedback('neutral', 'Введите ответ и нажмите «Проверить».');
        }

        /* ---------- Слушатели ---------- */
        document.getElementById('checkBtn').addEventListener('click', checkAnswer);
        document.getElementById('solutionBtn').addEventListener('click', showSolution);
        document.getElementById('newTaskBtn').addEventListener('click', newTask);
        answerInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkAnswer();
            }
        });

        /* ---------- Старт ---------- */
        initTheme();
        newTask();
    })();
</script>
</body>
</html>
