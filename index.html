<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОГЭ информатика · Тренажёр</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
    <style>
        :root {
            --bg: #eef1f5;
            --app-bg: #ffffff;
            --app-border: #d8dee6;
            --text: #1a2c44;
            --text-soft: #5a6b80;
            --text-muted: #7a8ca0;
            --panel-bg: #fbfcfe;
            --panel-border: #d5dee9;
            --panel-divider: #e2e8f1;
            --accent: #2f5c96;
            --accent-soft: #eaf1fb;
            --accent-border: #9ab8dc;
            --part-bg: #ffffff;
            --part-border: #d5dee9;
            --part-hover-bg: #edf3fb;
            --part-hover-border: #8faed0;
            --part-used-bg: #eef1f5;
            --part-used-border: #cfd8e3;
            --input-bg: #ffffff;
            --input-border: #c2cfe0;
            --input-focus: #4a78b0;
            --btn-primary-bg: #2f5c96;
            --btn-primary-hover: #23497a;
            --btn-secondary-bg: #ffffff;
            --btn-secondary-border: #9db8d6;
            --btn-secondary-hover: #eef3fa;
            --feedback-neutral-bg: #eef3fa;
            --feedback-neutral-text: #2f4d72;
            --feedback-neutral-border: #cddef0;
            --feedback-correct-bg: #e6f5ec;
            --feedback-correct-text: #1c6b3b;
            --feedback-correct-border: #a9d5b9;
            --feedback-incorrect-bg: #fdecec;
            --feedback-incorrect-text: #a83535;
            --feedback-incorrect-border: #f0b9b9;
            --feedback-solution-bg: #f2eefb;
            --feedback-solution-text: #46347a;
            --feedback-solution-border: #cec0ec;
            --shadow-app: 0 6px 24px rgba(0, 0, 0, 0.08);
            --shadow-chip: 0 1px 3px rgba(20, 40, 80, 0.06);
            --header-gradient: linear-gradient(90deg, #2f5c96 0%, #4a78b0 100%);
        }

        [data-theme="dark"] {
            --bg: #10161f;
            --app-bg: #1a2330;
            --app-border: #2a374a;
            --text: #e6edf6;
            --text-soft: #a4b3c7;
            --text-muted: #7e8fa5;
            --panel-bg: #1f2a3a;
            --panel-border: #2c3a4f;
            --panel-divider: #2c3a4f;
            --accent: #5b8fd6;
            --accent-soft: #223349;
            --accent-border: #3f5f8a;
            --part-bg: #223043;
            --part-border: #2f4056;
            --part-hover-bg: #2b3d55;
            --part-hover-border: #4f7ab0;
            --part-used-bg: #1b2534;
            --part-used-border: #2a374a;
            --input-bg: #16202d;
            --input-border: #33465f;
            --input-focus: #5b8fd6;
            --btn-primary-bg: #3b6ea8;
            --btn-primary-hover: #4f83c2;
            --btn-secondary-bg: #223043;
            --btn-secondary-border: #3f5f8a;
            --btn-secondary-hover: #2b3d55;
            --feedback-neutral-bg: #223349;
            --feedback-neutral-text: #b9cbe2;
            --feedback-neutral-border: #33465f;
            --feedback-correct-bg: #17362a;
            --feedback-correct-text: #8ee0b0;
            --feedback-correct-border: #2f6b4b;
            --feedback-incorrect-bg: #3a1e22;
            --feedback-incorrect-text: #f0a5a5;
            --feedback-incorrect-border: #6b3035;
            --feedback-solution-bg: #2a2440;
            --feedback-solution-text: #c3b3ec;
            --feedback-solution-border: #4b3f7a;
            --shadow-app: 0 8px 30px rgba(0, 0, 0, 0.5);
            --header-gradient: linear-gradient(90deg, #23497a 0%, #3b6ea8 100%);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        body {
            background: var(--bg);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 40px;
            color: var(--text);
        }

        .app {
            width: 100%;
            max-width: 1400px;
            background: var(--app-bg);
            border-radius: 10px;
            box-shadow: var(--shadow-app);
            border: 1px solid var(--app-border);
            overflow: hidden;
        }

        .header {
            background: var(--header-gradient);
            padding: 18px 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            color: #ffffff;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            padding: 20px 44px 0;
        }

        .nav-tab {
            flex: 1;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px 8px 0 0;
            background: var(--panel-bg);
            color: var(--text-soft);
            cursor: pointer;
            border: 1px solid var(--panel-border);
            border-bottom: none;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            background: var(--part-hover-bg);
            color: var(--text);
        }

        .nav-tab.active {
            background: var(--app-bg);
            color: var(--accent);
            border-top: 4px solid var(--accent);
            font-weight: 700;
            transform: translateY(1px);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            color: #ffffff;
            font-size: 18px;
            width: 44px;
            height: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.28); }

        .content {
            padding: 28px 44px 44px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .task-statement {
            background: var(--accent-soft);
            border-left: 4px solid var(--accent);
            padding: 18px 22px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text);
        }

        .task-statement .task-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.8px;
        }

        .task-statement .task-question {
            font-weight: 500;
            margin-top: 10px;
        }

        .work-area {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .parts-panel {
            flex: 1 1 320px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 18px;
        }

        .parts-panel h3, .build-zone h3 {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-soft);
            text-transform: uppercase;
            margin: 0 0 14px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--panel-divider);
        }

        .part-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            background: var(--part-bg);
            border: 1px solid var(--part-border);
            cursor: pointer;
            user-select: none;
        }

        .part-row:hover { background: var(--part-hover-bg); border-color: var(--part-hover-border); }
        .part-row.used { opacity: 0.4; pointer-events: none; box-shadow: none; }

        .part-number {
            font-weight: 700;
            color: var(--accent);
            font-size: 15px;
            min-width: 24px;
            text-align: right;
        }

        .part-text {
            font-family: 'Consolas', monospace;
            font-size: 15px;
            color: var(--text);
            word-break: break-all;
        }

        .build-panel {
            flex: 2 1 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .build-zone {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 18px;
            min-height: 110px;
        }

        .assembled-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            min-height: 46px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            color: var(--text);
        }

        .assembled-empty { color: var(--text-muted); font-style: italic; font-size: 14px; }

        .assembled-chip {
            background: transparent;
            border: none;
            padding: 2px 0;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            color: var(--text);
            cursor: pointer;
            display: inline;
        }

        .assembled-chip:hover { background: var(--accent-soft); color: var(--accent); }

        .answer-block {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 18px 20px;
            margin-top: 20px;
        }

        .answer-block label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-soft);
            margin-bottom: 10px;
        }

        .answer-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1.5px solid var(--input-border);
            font-size: 18px;
            font-family: 'Consolas', monospace;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
        }

        .answer-input:focus { border-color: var(--input-focus); }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 6px;
            border: 1.5px solid transparent;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--btn-primary-bg);
            color: #ffffff;
            border-color: var(--btn-primary-bg);
        }
        .btn-primary:hover { background: var(--btn-primary-hover); }

        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--accent);
            border-color: var(--btn-secondary-border);
        }
        .btn-secondary:hover { background: var(--btn-secondary-hover); }

        .intermediate-block {
            background: #fdfbf7;
            border: 1px solid #e5d9c5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        [data-theme="dark"] .intermediate-block {
            background: #1e1a14;
            border-color: #4a3f2a;
        }

        .intermediate-block.active { display: block; }

        .intermediate-title {
            font-weight: 700;
            color: #8c6d3f;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-size: 13px;
        }

        [data-theme="dark"] .intermediate-title { color: #d4b07a; }

        .inline-input {
            width: 50px;
            padding: 4px 6px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            text-align: center;
            border: 1px solid #c2cfe0;
            border-radius: 4px;
            background: #fff;
            color: #1a2c44;
            outline: none;
        }

        .inline-input:focus {
            border-color: #4a78b0;
            box-shadow: 0 0 0 2px rgba(74, 120, 176, 0.2);
        }

        .intermediate-text {
            font-size: 15px;
            line-height: 2.2;
            color: var(--text);
        }

        .feedback {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.6;
        }

        .feedback.neutral { background: var(--feedback-neutral-bg); color: var(--feedback-neutral-text); }
        .feedback.correct { background: var(--feedback-correct-bg); color: var(--feedback-correct-text); }
        .feedback.incorrect { background: var(--feedback-incorrect-bg); color: var(--feedback-incorrect-text); }
        .feedback.solution { background: var(--feedback-solution-bg); color: var(--feedback-solution-text); }

        @media (max-width: 820px) {
            body { padding: 16px; }
            .header, .content, .nav-tabs { padding-left: 16px; padding-right: 16px; }
            .work-area { flex-direction: column; }
            .nav-tab { padding: 12px; font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="app">

    <div class="header">
        <div class="header-left">
            <h1>ОГЭ информатика · Тренажёр</h1>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="themeToggle" title="Переключить тему">🌙</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" id="tab7">Задание №7 (Адресация)</button>
        <button class="nav-tab" id="tab1">Задание №1 (Кодирование)</button>
    </div>

    <div class="content">

        <!-- ЭКРАН 7 -->
        <div class="screen active" id="screen7">
            <div class="task-statement">
                <div class="task-title">Условие</div>
                <div id="task7Desc">Загрузка...</div>
                <div class="task-question">В ответе запишите последовательность цифр.</div>
            </div>

            <div class="work-area">
                <div class="parts-panel">
                    <h3>Фрагменты адреса</h3>
                    <div id="partsList"></div>
                </div>
                <div class="build-panel">
                    <div class="build-zone">
                        <h3>Собранный адрес</h3>
                        <div id="assembledContainer" class="assembled-container">
                            <div class="assembled-empty">Нажимайте на фрагменты слева...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="answer-block">
                <label>Ваш ответ:</label>
                <input type="text" id="answer7" class="answer-input" autocomplete="off" spellcheck="false">
                <div class="actions">
                    <button class="btn btn-primary" id="check7">Проверить</button>
                    <button class="btn btn-secondary" id="solution7">Решение</button>
                    <button class="btn btn-secondary" id="new7">Новое задание</button>
                </div>
                <div id="feedback7" class="feedback neutral">Выберите фрагменты и введите ответ.</div>
            </div>
        </div>

        <!-- ЭКРАН 1 -->
        <div class="screen" id="screen1">
            <div class="task-statement">
                <div class="task-title">Условие</div>
                <div id="task1Desc">Загрузка...</div>
                <div class="task-question" id="task1Question"></div>
            </div>

            <div class="intermediate-block active" id="intermediateBlock">
                <div class="intermediate-title">Промежуточные результаты</div>
                <div class="intermediate-text" id="intermediateText"></div>
                <div style="margin-top: 12px;">
                    <button class="btn btn-secondary" id="checkStepsBtn" style="padding: 8px 16px; font-size: 14px;">Проверить шаги</button>
                    <span id="stepsFeedback" style="margin-left: 12px; font-size: 14px; font-weight: 600;"></span>
                </div>
            </div>

            <div class="answer-block">
                <label>Ваш ответ (вычеркнутое слово):</label>
                <input type="text" id="answer1" class="answer-input" autocomplete="off" spellcheck="false">
                <div class="actions">
                    <button class="btn btn-primary" id="check1">Проверить</button>
                    <button class="btn btn-secondary" id="solution1">Решение</button>
                    <button class="btn btn-secondary" id="new1">Новое задание</button>
                </div>
                <div id="feedback1" class="feedback neutral">Введите ответ.</div>
            </div>
        </div>

    </div>
</div>

<script>
/* ============================================================
 *  ОБЩИЕ УТИЛИТЫ
 * ============================================================ */
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickNUnique(arr, n) { return shuffle(arr).slice(0, n); }
function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

/* ============================================================
 *  ТЕМА
 * ============================================================ */
const themeToggle = document.getElementById('themeToggle');
function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('oge-theme', t);
}
(function initTheme() {
    const saved = localStorage.getItem('oge-theme');
    if (saved) applyTheme(saved);
    else applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
})();
themeToggle.addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* ============================================================
 *  ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
 * ============================================================ */
const screen7 = document.getElementById('screen7');
const screen1 = document.getElementById('screen1');
const tab7 = document.getElementById('tab7');
const tab1 = document.getElementById('tab1');

function showScreen(n) {
    if (n === 7) {
        screen7.classList.add('active'); screen1.classList.remove('active');
        tab7.classList.add('active'); tab1.classList.remove('active');
    } else {
        screen1.classList.add('active'); screen7.classList.remove('active');
        tab1.classList.add('active'); tab7.classList.remove('active');
    }
}
tab7.addEventListener('click', () => showScreen(7));
tab1.addEventListener('click', () => showScreen(1));

/* ============================================================
 *  ЗАДАНИЕ №7
 * ============================================================ */
(function task7Module() {
    const PROTOCOLS = ['https', 'http', 'ftp'];
    const SERVERS = ['school', 'lyceum', 'university', 'college', 'gymnasium', 'academy', 'institute', 'campus'];
    const TLDS = ['.ru', '.com', '.org', '.net', '.edu', '.gov'];
    const FILENAMES = ['report', 'task', 'lesson', 'exam', 'notes', 'summary', 'project', 'schedule', 'plan', 'result'];
    const EXTENSIONS = ['.html', '.pdf', '.docx', '.txt', '.jpg', '.png', '.xml', '.json'];

    function buildTask(fragments, correct, prototypeName, desc, explain) {
        const numbered = shuffle([...fragments]);
        numbered.forEach((p, i) => { p.num = i + 1; });
        const sorted = numbered.slice().sort((a, b) => a.order - b.order);
        return { parts: numbered, correctOrder: sorted.map(p => p.num), correctString: correct, prototypeName, desc, explain };
    }

    function proto1() {
        const p = rand(PROTOCOLS), s = rand(SERVERS), t = rand(TLDS), fname = rand(FILENAMES), ext = rand(EXTENSIONS);
        const fragments = [
            { text: p, order: 1 }, { text: '://', order: 2 }, { text: s, order: 3 },
            { text: t, order: 4 }, { text: '/', order: 5 }, { text: fname, order: 6 }, { text: ext, order: 7 }
        ];
        const correct = `${p}://${s}${t}/${fname}${ext}`;
        const desc = `Доступ к файлу <b>${fname}${ext}</b>, находящемуся на сервере <b>${s}${t}</b>, осуществляется по протоколу <b>${p}</b>. Фрагменты адреса закодированы цифрами от 1 до ${fragments.length}.`;
        const explain = `Напомним, как формируется адрес. Сначала указывается протокол, потом «://», потом сервер, затем «/», название файла в конце. Адрес: <b>${correct}</b>.`;
        return buildTask(fragments, correct, 'URL-адрес', desc, explain);
    }
    function proto2() {
        const nums = [];
        while (nums.length < 4) { const n = randInt(0, 255); if (!nums.includes(n)) nums.push(n); }
        const lastIdx = randInt(0, 3), dotIdx = (lastIdx + 1) % 4;
        const fragments = [];
        nums.forEach((n, i) => { fragments.push({ text: i === dotIdx ? '.' + n : String(n), order: i + 1 }); });
        const correct = nums.join('.');
        const desc = `Обнаружены четыре обрывка бумаги, на которых записаны фрагменты одного IP-адреса. Фрагменты обозначены цифрами от 1 до 4.`;
        const explain = `IP-адрес — четыре разделённых точками числа, каждое не больше 255. Фрагмент с точкой в начале не может стоять первым. Правильный адрес: <b>${correct}</b>.`;
        return buildTask(fragments, correct, 'IP-адрес', desc, explain);
    }
    function proto3() {
        const p = rand(PROTOCOLS), s = 'magazin', t = rand(['.com', '.ru', '.org', '.net']);
        const fname = rand(['kassa', 'cassa', 'folder', 'summa', 'check', 'order']), ext = rand(['.xls', '.xlsx', '.pdf', '.doc']);
        const fragments = [
            { text: p, order: 1 }, { text: '://', order: 2 }, { text: s, order: 3 },
            { text: t, order: 4 }, { text: '/', order: 5 }, { text: fname, order: 6 }, { text: ext, order: 7 }
        ];
        const correct = `${p}://${s}${t}/${fname}${ext}`;
        const desc = `Доступ к файлу <b>${fname}${ext}</b>, находящемуся на сервере <b>${s}${t}</b>, осуществляется по протоколу <b>${p}</b>.`;
        const explain = `Сначала протокол, потом «://», потом сервер, затем «/», затем файл. Адрес: <b>${correct}</b>.`;
        return buildTask(fragments, correct, 'URL с протоколом', desc, explain);
    }
    function proto4() {
        const p = rand(PROTOCOLS), srv = rand(['web', 'host', 'server', 'site', 'portal']);
        const t1 = rand(['.txt', '.info', '.site', '.data', '.cloud']);
        const pathName = rand(['portal', 'index', 'main', 'home', 'start']);
        const fname = rand(['page', 'file', 'doc', 'task']), ext = rand(['.html', '.htm', '.php', '.asp']);
        const fragments = [
            { text: p, order: 1 }, { text: '://', order: 2 }, { text: srv, order: 3 },
            { text: t1, order: 4 }, { text: '/', order: 5 }, { text: pathName, order: 6 },
            { text: '/', order: 7 }, { text: fname + ext, order: 8 }
        ];
        const correct = `${p}://${srv}${t1}/${pathName}/${fname}${ext}`;
        const desc = `Доступ к файлу <b>${fname}${ext}</b>, находящемуся на сервере <b>${srv}${t1}</b>, по протоколу <b>${p}</b>. Файл лежит в каталоге <b>${pathName}</b>.`;
        const explain = `Протокол, «://», сервер, «/», каталог, «/», файл. Адрес: <b>${correct}</b>.`;
        return buildTask(fragments, correct, 'URL с каталогом', desc, explain);
    }
    const PROTOTYPES = [proto1, proto2, proto3, proto4];

    let currentTask = null;
    const usedNums = new Set();
    let assembled = [];

    const partsListEl = document.getElementById('partsList');
    const assembledContainer = document.getElementById('assembledContainer');
    const answerInput = document.getElementById('answer7');
    const feedback = document.getElementById('feedback7');
    const taskDescEl = document.getElementById('task7Desc');

    function setFeedback(type, html) { feedback.className = 'feedback ' + type; feedback.innerHTML = html; }

    function renderParts() {
        partsListEl.innerHTML = '';
        [...currentTask.parts].sort((a, b) => a.num - b.num).forEach(part => {
            const row = document.createElement('div');
            row.className = 'part-row' + (usedNums.has(part.num) ? ' used' : '');
            row.innerHTML = `<span class="part-number">${part.num})</span><span class="part-text">${escapeHtml(part.text)}</span>`;
            row.addEventListener('click', () => addPart(part.num));
            partsListEl.appendChild(row);
        });
    }

    function renderAssembled() {
        assembledContainer.innerHTML = '';
        if (assembled.length === 0) {
            assembledContainer.innerHTML = '<div class="assembled-empty">Нажимайте на фрагменты слева...</div>';
            return;
        }
        assembled.forEach(part => {
            const chip = document.createElement('span');
            chip.className = 'assembled-chip';
            chip.textContent = part.text;
            chip.addEventListener('click', () => removePart(part.num));
            assembledContainer.appendChild(chip);
        });
    }

    function addPart(num) {
        if (usedNums.has(num)) return;
        const part = currentTask.parts.find(p => p.num === num);
        usedNums.add(num); assembled.push(part);
        renderParts(); renderAssembled();
    }
    function removePart(num) {
        const idx = assembled.findIndex(p => p.num === num);
        if (idx === -1) return;
        assembled.splice(idx, 1); usedNums.delete(num);
        renderParts(); renderAssembled();
    }

    function checkAnswer() {
        const raw = answerInput.value.trim();
        if (!raw) { setFeedback('incorrect', 'Введите ответ.'); return; }
        if (!/^[0-9]+$/.test(raw)) { setFeedback('incorrect', 'Только цифры.'); return; }
        const userSeq = raw.split('').map(Number);
        const correct = currentTask.correctOrder;
        if (userSeq.length !== correct.length) {
            setFeedback('incorrect', `Неверно. Вы указали ${userSeq.length} цифр, а в адресе ${correct.length} фрагментов. Правильная последовательность: <b>${correct.join('')}</b>.`);
            return;
        }
        if (userSeq.every((v, i) => v === correct[i])) {
            setFeedback('correct', 'Верно!');
        } else {
            setFeedback('incorrect', `Неверно. Правильная последовательность: <b>${correct.join('')}</b>.`);
        }
    }

    function showSolution() {
        const listItems = [...currentTask.parts].sort((a, b) => a.num - b.num).map(p => `<li><b>${p.num}</b> — ${escapeHtml(p.text)}</li>`).join('');
        setFeedback('solution', `<div class="sol-title">Решение</div><div class="sol-explain">${currentTask.explain}</div><div class="sol-label">Правильная последовательность:</div><div class="sol-answer">${currentTask.correctOrder.join('')}</div><ul class="sol-list">${listItems}</ul>`);
    }

    function newTask() {
        currentTask = rand(PROTOTYPES)();
        usedNums.clear(); assembled = [];
        answerInput.value = '';
        taskDescEl.innerHTML = currentTask.desc;
        renderParts(); renderAssembled();
        setFeedback('neutral', 'Выберите фрагменты и введите ответ.');
    }

    document.getElementById('check7').addEventListener('click', checkAnswer);
    document.getElementById('solution7').addEventListener('click', showSolution);
    document.getElementById('new7').addEventListener('click', newTask);
    answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
    newTask();
})();

    };

    const CATEGORIES = [
        { key: 'islands', label: 'острова' }, { key: 'fish', label: 'рыбы' },
        { key: 'languages', label: 'языки программирования' }, { key: 'subjects', label: 'школьные предметы' },
        { key: 'animals', label: 'дикие животные' }, { key: 'conifers', label: 'хвойные растения' },
        { key: 'felines', label: 'кошачьи' }, { key: 'programLang2', label: 'языки программирования' },
        { key: 'mammals', label: 'млекопитающие' }, { key: 'animals2', label: 'животные' },
        { key: 'professions', label: 'профессии' }, { key: 'rivers', label: 'реки' },
        { key: 'countries', label: 'страны' }, { key: 'seas', label: 'моря' }
    ];

    const ENCODINGS = [
        { name: 'КОИ-8', bitsPerChar: 8 },
        { name: 'Unicode', bitsPerChar: 16 }
    ];

    let currentTask = null;

    const taskQuestionEl = document.getElementById('task1Question');

    const intermediateText = document.getElementById('intermediateText');
    const stepsFeedback = document.getElementById('stepsFeedback');

    function setFeedback(type, html) { feedback.className = 'feedback ' + type; feedback.innerHTML = html; }

    function generate() {
        const cat = rand(CATEGORIES);
        const encoding = rand(ENCODINGS);
        const list = WORDS[cat.key];

        // 1. Выбираем слова ТОЛЬКО с уникальной длиной, чтобы ответ был однозначным
        const uniqueLenWords = [];
        const usedLens = new Set();
        for (const word of shuffle(list)) {
            // Берем слово, если такой длины еще не было
            if (!usedLens.has(word.length)) {
                usedLens.add(word.length);
                uniqueLenWords.push(word);
            }
        }

        // Берем от 4 до 6 слов
        const n = randInt(4, Math.min(6, uniqueLenWords.length));
        const chosen = uniqueLenWords.slice(0, n);

        // 2. Целевое слово — строго не первое и не последнее
        const targetIndex = randInt(1, chosen.length - 2);
        const targetWord = chosen[targetIndex];

        const bpc = encoding.bitsPerChar / 8;
        const len = targetWord.length;
        const deltaBytes = (len + 2) * bpc;

        const sentence = '«' + chosen.join(', ') + ' — ' + cat.label + '».';

        const desc = `В кодировке ${encoding.name} каждый символ кодируется ${encoding.bitsPerChar} битами. ` +
                     `Ученик написал текст:<br><br><b>${escapeHtml(sentence)}</b><br><br>` +
                     `Ученик вычеркнул из списка название одного из ${cat.label}. Заодно он вычеркнул ставшие лишними запятые и пробелы — два пробела не должны идти подряд.<br>` +
                     `При этом размер нового предложения в данной кодировке оказался на <b>${deltaBytes}</b> байт меньше, чем размер исходного предложения.`;

        const question = `Напишите в ответе вычеркнутое название.`;
        
        const stepsData = {
            bits: encoding.bitsPerChar,
            bpc: bpc,
            deltaBytes: deltaBytes,
            len: len,
            answer: targetWord,
            encodingName: encoding.name
        };

        return { desc, question, answer: targetWord, stepsData, explain: `В кодировке ${encoding.name} 1 символ = ${bpc} байт. Исчезло ${deltaBytes} байт. Это ${deltaBytes / bpc} символов. Из них 2 символа (запятая и пробел). Значит, слово = ${len} символов. Ответ: <b>${targetWord}</b>.` };
    }

    function renderIntermediate(data) {
        stepsFeedback.textContent = '';
        
        intermediateText.innerHTML = `
            на 1 символ <input type="text" class="inline-input" id="step1a" placeholder="_"> бит = 
            <input type="text" class="inline-input" id="step1b" placeholder="_"> байтов<br>
            
            на запятую и пробел отводится <input type="text" class="inline-input" id="step2a" placeholder="_"> бит = 
            <input type="text" class="inline-input" id="step2b" placeholder="_"> байт<br>
            
            тогда искомое слово занимает <input type="text" class="inline-input" id="step3a" placeholder="_"> байт = 
            <input type="text" class="inline-input" id="step3b" placeholder="_"> символов
        `;

        const checkBtn = document.getElementById('checkStepsBtn');
        const newCheckBtn = checkBtn.cloneNode(true);
        checkBtn.parentNode.replaceChild(newCheckBtn, checkBtn);

        newCheckBtn.addEventListener('click', () => {
            const v = id => document.getElementById(id).value.trim();
            const isNum = (val, exp) => val !== '' && !isNaN(val) && Number(val) === Number(exp);

            const c1a = isNum(v('step1a'), data.bits);
            const c1b = isNum(v('step1b'), data.bpc);
            const c2a = isNum(v('step2a'), data.bits * 2);
            const c2b = isNum(v('step2b'), data.bpc * 2);
            const c3a = isNum(v('step3a'), data.deltaBytes);
            const c3b = isNum(v('step3b'), data.len);

            if (c1a && c1b && c2a && c2b && c3a && c3b) {
                stepsFeedback.innerHTML = '<span style="color: var(--feedback-correct-text);">Верно! Вычислите слово.</span>';
            } else {
                let err = [];
                if (!c1a || !c1b) err.push('1 символ');
                if (!c2a || !c2b) err.push('запятая и пробел');
                if (!c3a || !c3b) err.push('искомое слово');
                stepsFeedback.innerHTML = `<span style="color: var(--feedback-incorrect-text);">Ошибка в шагах: ${err.join(', ')}</span>`;
            }
        });
    }

    function checkAnswer() {

        if (!raw) { setFeedback('incorrect', 'Введите ответ.'); return; }

            setFeedback('correct', `Верно. Ответ: <b>${escapeHtml(expected)}</b>.`);

            setFeedback('incorrect', `Неверно. Вы указали <b>${escapeHtml(raw)}</b>. Правильный ответ: <b>${escapeHtml(expected)}</b>.`);
